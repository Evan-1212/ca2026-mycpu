<rect class="box" x="560" y="650" width="290" height="46" rx="3"/><text class="title" x="705" y="669">mycpu.common.SimCtrl</text><text class="line" x="705" y="685">0x1000_1000, 4 KiB</text>
<polyline class="wire" points="105,590 105,530 560,530" marker-end="url(#head)"/><text class="wlabel" x="332.5" y="526" text-anchor="middle">imem: fetch port</text>
<polyline class="wire" points="335,570 335,550 560,550" marker-end="url(#head)"/><text class="wlabel" x="447.5" y="546" text-anchor="middle">data port</text>
<polyline class="wire" points="160,615 260,615" marker-end="url(#head)"/><text class="wlabel" x="210" y="611" text-anchor="middle">dmem</text>
<polyline class="wire" points="410,613 560,613" marker-end="url(#head)"/><text class="wlabel" x="485" y="609" text-anchor="middle">0x1000_0xxx</text>
<polyline class="wire" points="410,673 560,673" marker-end="url(#head)"/><text class="wlabel" x="485" y="669" text-anchor="middle">0x1000_1xxx</text>
<polyline class="wire" points="335,690 335,740" marker-end="url(#head)"/><text class="wlabel" x="339" y="719">any other address</text>
<text class="free" x="345" y="765" text-anchor="start">error: the core halts (BadAddress)</text>
