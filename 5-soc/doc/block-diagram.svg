<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="600" viewBox="0 0 1110 600" role="img" aria-label="T5: the AXI4-Lite system-on-chip">
<title>T5: the AXI4-Lite system-on-chip</title>
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;fill:#1f2328}.title{font-weight:bold;text-anchor:middle}.line{text-anchor:middle}.glabel{font-weight:bold;fill:#57606a}.wlabel{font-size:11px;fill:#57606a}.box{fill:#f6f8fa;stroke:#1f2328;stroke-width:1.2}.group{fill:none;stroke:#8c959f;stroke-width:1;stroke-dasharray:6 4}.wire{fill:none;stroke:#1f2328;stroke-width:1.2}.dashed{stroke-dasharray:4 3}.head{fill:#1f2328}.bg{fill:#ffffff}@media (prefers-color-scheme:dark){text{fill:#e6edf3}.glabel,.wlabel{fill:#9198a1}.box{fill:#161b22;stroke:#e6edf3}.group{stroke:#6e7681}.wire{stroke:#e6edf3}.head{fill:#e6edf3}.bg{fill:#0d1117}}</style>
<defs><marker id="head" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="tail" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head" d="M10,0 L0,5 L10,10 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1110" height="600"/>
<rect class="box" x="120" y="20" width="860" height="50" rx="3"/><text class="title" x="550" y="41">CPU: the T4 pipeline</text><text class="line" x="550" y="57">imem: Decoupled request, Valid response; dmem: one request in flight</text>
<rect class="box" x="150" y="120" width="230" height="50" rx="3"/><text class="title" x="265" y="141">Axi4LiteMaster (I)</text><text class="line" x="265" y="157">[checker]</text>
<rect class="box" x="720" y="120" width="230" height="50" rx="3"/><text class="title" x="835" y="141">Axi4LiteMaster (D)</text><text class="line" x="835" y="157">[checker]</text>
<polyline class="wire" points="265,70 265,120" marker-end="url(#head)"/><text class="wlabel" x="269" y="99">imem</text>
<polyline class="wire" points="835,70 835,120" marker-end="url(#head)"/><text class="wlabel" x="839" y="99">dmem</text>
<rect class="box" x="60" y="230" width="980" height="90" rx="3"/><text class="title" x="550" y="255">Axi4LiteXbar</text><text class="line" x="550" y="271">Axi4LiteDecoder per master: an unmapped address gets DECERR</text><text class="line" x="550" y="287">Axi4LiteArbiter per shared slave (the D master first)</text><text class="line" x="550" y="303">a [checker] on every slave port</text>
<polyline class="wire" points="265,170 265,230" marker-end="url(#head)"/><text class="wlabel" x="269" y="204">AW W B AR R</text>
<polyline class="wire" points="835,170 835,230" marker-end="url(#head)"/><text class="wlabel" x="839" y="204">AW W B AR R</text>
<rect class="box" x="60" y="400" width="127" height="66" rx="3"/><text class="title" x="123.5" y="421">Axi4LiteRom</text><text class="line" x="123.5" y="437">0x0000_1000</text><text class="line" x="123.5" y="453">boot.S</text>
<rect class="box" x="202" y="400" width="127" height="66" rx="3"/><text class="title" x="265.5" y="421">MemPortSlave</text><text class="line" x="265.5" y="437">CLINT</text><text class="line" x="265.5" y="453">0x0200_0000</text>
<rect class="box" x="344" y="400" width="127" height="66" rx="3"/><text class="title" x="407.5" y="421">MemPortSlave</text><text class="line" x="407.5" y="437">UART</text><text class="line" x="407.5" y="453">0x1000_0000</text>
<rect class="box" x="486" y="400" width="127" height="66" rx="3"/><text class="title" x="549.5" y="421">MemPortSlave</text><text class="line" x="549.5" y="437">SimCtrl</text><text class="line" x="549.5" y="453">0x1000_1000</text>
<rect class="box" x="628" y="400" width="127" height="66" rx="3"/><text class="title" x="691.5" y="421">MemPortSlave</text><text class="line" x="691.5" y="437">VGA</text><text class="line" x="691.5" y="453">0x2000_0000</text>
<rect class="box" x="770" y="400" width="127" height="66" rx="3"/><text class="title" x="833.5" y="421">MemPortSlave</text><text class="line" x="833.5" y="437">phone</text><text class="line" x="833.5" y="453">0x2010_0000</text>
<rect class="box" x="912" y="400" width="128" height="66" rx="3"/><text class="title" x="976" y="421">Axi4LiteRam</text><text class="line" x="976" y="437">(I and D)</text><text class="line" x="976" y="453">0x8000_0000</text>
<polyline class="wire" points="123,320 124,320 124,400" marker-end="url(#head)"/>
<polyline class="wire" points="265,320 266,320 266,400" marker-end="url(#head)"/>
<polyline class="wire" points="407,320 408,320 408,400" marker-end="url(#head)"/>
<polyline class="wire" points="549,320 550,320 550,400" marker-end="url(#head)"/>
<polyline class="wire" points="691,320 692,320 692,400" marker-end="url(#head)"/>
<polyline class="wire" points="833,320 834,320 834,400" marker-end="url(#head)"/>
<polyline class="wire" points="945,320 945,400" marker-end="url(#head)"/>
<polyline class="wire" points="1005,320 1005,400" marker-end="url(#head)"/>
<rect class="box" x="220" y="520" width="490" height="40" rx="3"/><text class="title" x="465" y="544">CPU interrupts: msip, mtip, meip</text>
<polyline class="wire" points="266,466 266,520 265,520" marker-end="url(#head)"/><text class="wlabel" x="270" y="497">msip, mtip</text>
<polyline class="wire" points="408,466 408,520 407,520" marker-end="url(#head)"/><text class="wlabel" x="412" y="497">irq: meip</text>
<polyline class="wire" points="550,466 550,520 549,520" marker-end="url(#head)"/><text class="wlabel" x="554" y="497">meip</text>
<polyline class="wire" points="692,466 692,520 691,520" marker-end="url(#head)"/><text class="wlabel" x="696" y="497">video pins</text>
<polyline class="wire" points="834,466 834,520 833,520" marker-end="url(#head)"/><text class="wlabel" x="838" y="497">meip, events (harness)</text>
<polyline class="wire" points="1100,560 1100,433 1040,433" marker-end="url(#head)"/>
<text class="free" x="1090" y="550" text-anchor="end">harness (sim/main.cpp): load port</text>
<text class="free" x="1090" y="567" text-anchor="end">writes the program during reset</text>
<text class="free" x="20" y="590" text-anchor="start">Soc (module SimTop). Every [checker] is an Axi4LiteChecker on that channel set.</text>
</svg>
